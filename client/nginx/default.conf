server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ✅ Static assets: if missing => 404 (NO index.html)
  location ~* \.(?:webp|png|jpe?g|gif|svg|ico|css|js|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
  }

  # ✅ SPA fallback only for routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ✅ Avoid caching index.html aggressively
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
