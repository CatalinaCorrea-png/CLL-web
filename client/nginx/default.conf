# ✅ MIME types de los modelos 3D del configurador, que no vienen en /etc/nginx/mime.types.
#    Este archivo se incluye dentro de http {}, así que este bloque se SUMA a mime.types
#    (application/wasm ya viene). No moverlo adentro de server/location: ahí REEMPLAZARÍA
#    todo el mapa y js/css saldrían como application/octet-stream.
types {
  model/gltf-binary  glb;
  model/gltf+json    gltf;
  image/ktx2         ktx2;
  image/vnd.radiance hdr;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ✅ Build de Vite (/assets/): el nombre lleva un hash que cambia con el contenido,
  #    así que se puede cachear un año sin riesgo de servir una versión vieja.
  #    ^~ hace que esta regla le gane a la regex de abajo.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # Seguridad (se repite en cada location: un add_header adentro anula los del server)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    access_log off;
  }

  # ✅ Archivos de public/ (fotos, favicon, og_image, modelos 3D): NO llevan hash.
  #    1 día de caché; después el navegador revalida (ETag -> 304 si no cambió).
  #    Si falta el archivo => 404 (NO index.html). Clave para los modelos: si un .glb
  #    faltante devolviera index.html con 200, el loader fallaría con un error de parseo confuso.
  location ~* \.(?:webp|png|jpe?g|gif|svg|ico|css|js|woff2?|glb|gltf|bin|ktx2|hdr|wasm)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    # Seguridad (se repite en cada location: un add_header adentro anula los del server)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    access_log off;
  }

  # ✅ SPA fallback only for routes
  location / {
    try_files $uri $uri/ /index.html;
    # Seguridad (se repite en cada location: un add_header adentro anula los del server)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }

  # ✅ Avoid caching index.html aggressively
  location = /index.html {
    add_header Cache-Control "no-cache";
    # Seguridad (se repite en cada location: un add_header adentro anula los del server)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }
}
