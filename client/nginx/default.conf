server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ✅ Build de Vite (/assets/): el nombre lleva un hash que cambia con el contenido,
  #    así que se puede cachear un año sin riesgo de servir una versión vieja.
  #    ^~ hace que esta regla le gane a la regex de abajo.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ✅ Archivos de public/ (fotos, favicon, og_image): NO llevan hash.
  #    1 día de caché; después el navegador revalida (ETag -> 304 si no cambió).
  #    Si falta el archivo => 404 (NO index.html).
  location ~* \.(?:webp|png|jpe?g|gif|svg|ico|css|js|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    access_log off;
  }

  # ✅ SPA fallback only for routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ✅ Avoid caching index.html aggressively
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
