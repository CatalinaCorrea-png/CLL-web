services:
  db:
    image: mysql:8.0
    restart: always
    # NOTA: la tabla se llama 'imagenesfabricacion' (minúsculas) en los .sql y en el código,
    # así funciona con lower_case_table_names=0 (default de Linux) sin necesidad de forzar nada
    # ni borrar el volumen. NO agregar --lower-case-table-names sobre un volumen ya inicializado.
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      # OJO: la imagen mysql:8.0 rechaza MYSQL_USER=root. Como DB_USER=root, el usuario root
      # se configura solo con MYSQL_ROOT_PASSWORD (no usar MYSQL_USER/MYSQL_PASSWORD aquí).
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet
    # Optional: only if you want to connect from outside VPS
    # ports:
    #   - "3306:3306"

  api:
    build:
      context: ./server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Pedidos de presupuesto (POST /presupuestos). Ver .env.example.
      # MAIL_PROVEEDOR: prueba (no manda: deja los mails como archivos) | smtp (Gmail) | resend
      MAIL_PROVEEDOR: ${MAIL_PROVEEDOR:-prueba}
      MAIL_VENTAS: ${MAIL_VENTAS:-}
      MAIL_REMITENTE: ${MAIL_REMITENTE:-}
      MAIL_TIEMPO_RESPUESTA: ${MAIL_TIEMPO_RESPUESTA:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Capturas del 3D y mails de prueba: en volúmenes, así no se pierden al redeployar
      CAPTURAS_DIR: /app/capturas
      MAIL_CARPETA_PRUEBA: /app/mails-prueba
    volumes:
      - capturas:/app/capturas
      - mails_prueba:/app/mails-prueba
    depends_on:
      - db
    expose:
      - "3001"
    networks:
      - appnet

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: always
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - appnet

volumes:
  mysql_data:
  capturas:
  mails_prueba:

networks:
  appnet:
    driver: bridge