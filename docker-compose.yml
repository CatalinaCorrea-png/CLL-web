services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet

  mongo:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - appnet

  api:
    build:
      context: ./server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/cll?authSource=admin
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - db
      - mongo
    expose:
      - "3001"
    networks:
      - appnet

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: always
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - appnet

volumes:
  mysql_data:
  mongo_data:

networks:
  appnet:
    driver: bridge